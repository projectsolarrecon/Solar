name: Temporary indexing validation

on:
  push:
    branches:
      - fix/indexing-sitemap-consistency

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/indexing-sitemap-consistency

      - name: Regenerate canonical sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Verify indexing configuration
        run: node scripts/check-indexing-config.mjs

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies for validation
        run: bun install

      - name: Build site
        run: bun run build

      - name: Commit generated sitemap if changed
        run: |
          if git diff --quiet -- public/sitemap.xml; then
            echo "Sitemap already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          git commit -m "Regenerate canonical sitemap"
          git push origin HEAD:fix/indexing-sitemap-consistency
