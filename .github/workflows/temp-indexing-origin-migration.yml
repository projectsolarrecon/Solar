name: Temporary indexing origin migration

on:
  push:
    branches:
      - fix/indexing-sitemap-consistency

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/indexing-sitemap-consistency

      - name: Normalize legacy origin references
        run: node scripts/migrate-indexing-origin.mjs

      - name: Regenerate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Verify indexing configuration
        run: node scripts/check-indexing-config.mjs

      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public index.html
          git commit -m "Normalize indexing origins and regenerate sitemap"
          git push origin HEAD:fix/indexing-sitemap-consistency
