name: Temporary indexing PR migration

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Normalize legacy origin references
        run: node scripts/migrate-indexing-origin.mjs

      - name: Regenerate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Verify indexing configuration
        run: node scripts/check-indexing-config.mjs

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No generated changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public index.html
          git commit -m "Normalize indexing origins and regenerate sitemap"
          git push origin HEAD:${{ github.head_ref }}
